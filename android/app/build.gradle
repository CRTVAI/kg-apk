plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseStoreFile = System.getenv('KG_AUTO_STORE_FILE') ?: keystoreProperties['storeFile']
def releaseStorePassword = System.getenv('KG_AUTO_STORE_PASSWORD') ?: keystoreProperties['storePassword']
def releaseKeyAlias = System.getenv('KG_AUTO_KEY_ALIAS') ?: keystoreProperties['keyAlias']
def releaseKeyPassword = System.getenv('KG_AUTO_KEY_PASSWORD') ?: keystoreProperties['keyPassword']
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "com.kgauto.app"
    compileSdkVersion 36
    ndkVersion "28.0.13004108"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.kgauto.app"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.allTasks.any { it.path.toLowerCase().contains("release") } &&
            !hasReleaseSigning) {
        throw new GradleException("Release signing is missing. Provide KG_AUTO_STORE_FILE, KG_AUTO_STORE_PASSWORD, KG_AUTO_KEY_ALIAS, and KG_AUTO_KEY_PASSWORD environment variables, or create android/key.properties from android/key.properties.example with the Play Console upload key.")
    }
}
