name: cargo
description: A new Flutter project.
publish_to: 'none'
version: 1.0.5+7

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  get: ^4.7.2
  intl: ^0.18.0
  shared_preferences: ^2.1.1
  http: ^1.2.2
  flutter_screenutil: ^5.9.3
  hexcolor: ^3.0.1
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.4.0
  loading_animation_widget: ^1.2.0+4
  badges: ^3.1.1
  country_picker: ^2.0.20
  country_code_picker: ^3.0.0
  fl_chart: ^0.63.0
  syncfusion_flutter_charts: ^22.1.37
  pull_to_refresh: ^2.0.0
  sqflite: ^2.3.0
  path_provider: ^2.0.15
  dropdown_search: ^5.0.6
  community_charts_flutter: ^1.0.2
  image_picker: ^1.0.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.3.1
  card_swiper: ^3.0.1
  gallery_saver:
    path: third_party/gallery_saver
  firebase_core: ^2.13.0
  firebase_messaging: ^14.6.1
  firebase_in_app_messaging: ^0.7.3+1
  flutter_local_notifications: ^17.2.4
  permission_handler: ^10.2.0
  persistent_bottom_nav_bar: ^5.0.2
  file_picker: ^5.5.0
  video_thumbnail: ^0.5.3
  path: ^1.8.3
  webview_flutter: ^4.2.4
  open_file: ^3.3.2
  chips_choice: ^3.0.1
  share_plus: ^7.2.2

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/mini-logo.jpeg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/mini-logo.jpeg"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/mini-logo.jpeg"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/mini-logo.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
